<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#e4e7ec;--ok:#12805c;--bad:#c01048}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--tx:#eceff4;--mu:#9aa4b2;--bd:#2d333d;--ok:#4cd2a0;--bad:#f77fa6}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
.card{width:100%;max-width:380px;margin:16px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:24px}
h1{font-size:1.3rem;margin:0 0 4px}p{color:var(--mu);margin:0 0 16px;font-size:.9rem}
input{width:100%;padding:10px;margin-bottom:10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
button{width:100%;padding:10px;border:0;border-radius:6px;background:#2f6fed;color:#fff;font-size:1rem;cursor:pointer}
#msg{margin-top:12px;font-size:.95rem;min-height:1.2em}.ok{color:var(--ok)}.bad{color:var(--bad)}
</style></head><body>
<div class="card"><h1>Create account</h1><p>Duplicate or invalid details are rejected.</p>
<input id="n" placeholder="Full name"><input id="e" placeholder="Email"><input id="p" placeholder="Phone (optional)">
<button onclick="reg()">Register</button><div id="msg"></div></div>
<script>
async function reg(){
 const m=document.getElementById("msg");
 const r=await fetch("/register",{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({name:n.value,email:e.value,phone:p.value})});
 const d=await r.json();m.className=d.ok?"ok":"bad";m.textContent=d.message;
 if(d.ok){n.value=e.value=p.value="";}}
</script></body></html>
